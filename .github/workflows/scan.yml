name: Scan Container Image

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan image
        uses: anchore/scan-action@v6
        with:
          image: "eclipse-temurin:25.0.4_7-jre-alpine"
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: results.sarif

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate PDF report
        run: |
          python -m pip install --disable-pip-version-check reportlab
          python scripts/generate_vulnerability_report.py results.sarif vulnerability-report.pdf

      - name: Upload scan report artifact
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-temurin-25.0.4_7-jre-alpine-scan
          path: |
            results.sarif
            vulnerability-report.pdf
          retention-days: 30

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif